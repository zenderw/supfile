services:
  postgres:
    image: postgres:16-alpine
    container_name: supfile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supfile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-supfile}
    volumes:
      - supfile_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-supfile}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: supfile-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-supfile}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-supfile}?schema=public
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/v1/auth/google/callback}
      WEB_OAUTH_REDIRECT_URL: ${WEB_OAUTH_REDIRECT_URL:-http://localhost/auth/oauth-callback}
      PORT: 3000
      STORAGE_PATH: /data
    ports:
      - '3000:3000'
    volumes:
      - supfile_storage:/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    container_name: supfile-web
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api

volumes:
  supfile_pg_data:
    name: supfile_pg_data
  supfile_storage:
    name: supfile_storage
