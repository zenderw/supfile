services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-supfile-postgres}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - pg_data:${POSTGRES_DATA_DIR:-/var/lib/postgresql/data}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-10}

  api:
    build:
      context: .
      dockerfile: ${API_DOCKERFILE:-apps/api/Dockerfile}
    container_name: ${API_CONTAINER_NAME:-supfile-api}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_CONTAINER_PORT:-5432}/${POSTGRES_DB}?schema=${POSTGRES_SCHEMA:-public}
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:?required}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:?required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:?required}
      WEB_OAUTH_REDIRECT_URL: ${WEB_OAUTH_REDIRECT_URL:?required}
      PORT: ${API_PORT:?required}
      STORAGE_PATH: ${API_STORAGE_PATH:?required}
    ports:
      - '${API_HOST_PORT:-3000}:${API_PORT}'
    volumes:
      - storage:${API_STORAGE_PATH}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ${WEB_DOCKERFILE:-apps/web/Dockerfile}
      args:
        VITE_API_URL: ${VITE_API_URL:?required}
    container_name: ${WEB_CONTAINER_NAME:-supfile-web}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - '${WEB_HOST_PORT:-80}:${WEB_CONTAINER_PORT:-80}'
    depends_on:
      - api

volumes:
  pg_data:
    name: ${POSTGRES_VOLUME_NAME:-supfile_pg_data}
  storage:
    name: ${STORAGE_VOLUME_NAME:-supfile_storage}
